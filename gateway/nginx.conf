# Single front door for Sanjay Wood Tech:
#   /          → public Next.js website
#   /login     → staff sign-in (website)
#   /app/      → internal staff dashboard (Vite SPA)
#   /api/      → FastAPI
server {
    listen 80;
    client_max_body_size 20m;

    # API — strip /api prefix so FastAPI sees /auth/login, /public/…, etc.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /app {
        return 302 /app/;
    }

    # Staff dashboard (built with Vite base /app/)
    location /app/ {
        proxy_pass http://dashboard:80/app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Public website (and /login)
    location / {
        proxy_pass http://website:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
