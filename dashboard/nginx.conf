server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Direct access to the dashboard container still proxies /api (e.g. :8081).
    # Behind the gateway, browsers hit /api on the gateway host instead.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /app {
        return 302 /app/;
    }

    # Vite builds with base: '/app/' — assets and SPA live under /app/
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location = / {
        return 302 /app/;
    }
}
