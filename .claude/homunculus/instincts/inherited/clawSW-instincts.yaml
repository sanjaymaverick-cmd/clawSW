# ClawSW Workflow Add New Database Table And Api

## Action

Follow the add-new-database-table-and-api workflow:
1. Define new table(s) in models.py
2. Generate Alembic migration for schema changes
3. Update schemas.py with new Pydantic models
4. Update or create relevant routers (e.g., public.py, website.py, tally.py) to expose new endpoints
5. Update seed.py to seed initial data and permissions
6. Update or add tests for new functionality (test_seed.py, test_<feature>.py)
7. Update documentation (docs/BLUEPRINT.md) to reflect schema and permission changes
8. Update frontend (Next.js or dashboard) to consume new API endpoints if applicable

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: api/app/models.py, api/app/schemas.py, api/app/routers/*.py

