name: clawsw

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: clawsw
      POSTGRES_USER: clawsw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clawsw -d clawsw"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Postgres is intentionally NOT published to the host network;
    # only services on the internal compose network can reach it.

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://clawsw:${POSTGRES_PASSWORD}@db:5432/clawsw
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ADMIN_NAME: ${ADMIN_NAME:-Owner}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
      # Mock/demo dataset (Phase 8). Leave off for real deployments; set true
      # only on a rehearsal/demo box to seed fictional data + one login per
      # non-owner role. Idempotent, so safe to leave set across reboots.
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-false}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo-password}
      # AI query layer (Phase 7). Server-side only: the key is given to the
      # api container exclusively — never to the dashboard/website builds.
      # Leave empty to run with AI queries disabled.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-4-8}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Tally XML bridge (Phase 5) — its own service so a Tally outage never
  # blocks the API: pushes confirmed website orders as Sales vouchers and
  # polls Receipt vouchers for payment status.
  tally-bridge:
    build: ./api
    command: ["python", "-m", "app.tally_worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://clawsw:${POSTGRES_PASSWORD}@db:5432/clawsw
      # Tally Prime's XML/HTTP gateway on the LAN. Point at a SANDBOX
      # company first (blueprint Phase 5) before production data.
      TALLY_URL: ${TALLY_URL:-http://host.docker.internal:9000}
      TALLY_COMPANY: ${TALLY_COMPANY:-}
      TALLY_SALES_LEDGER: ${TALLY_SALES_LEDGER:-Sales}
      TALLY_PARTY_LEDGER: ${TALLY_PARTY_LEDGER:-Website Customers}
      TALLY_SYNC_INTERVAL_SECONDS: ${TALLY_SYNC_INTERVAL_SECONDS:-60}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started  # API runs migrations on startup

  # Encrypted backup cron (Phase 6): pg_dump | gzip | AES-256 into
  # BACKUP_DIR — point that at a SECOND local disk so losing the primary
  # SSD doesn't lose the backups too. Restore:
  #   docker compose run --rm backup /scripts/restore.sh /backups/<file>
  backup:
    image: postgres:16
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup_cron.sh"]
    environment:
      PGHOST: db
      PGUSER: clawsw
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: clawsw
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:?set BACKUP_PASSPHRASE in .env}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - ./scripts:/scripts:ro
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy

  dashboard:
    build: ./dashboard
    restart: unless-stopped
    depends_on:
      - api
    # Not published on the host — use the gateway at :8080/app/
    # (optional direct debug: docker compose port dashboard 80)

  website:
    build:
      context: ./website
      args:
        # Baked into the client bundle. Defaults target the gateway so the
        # browser stays same-origin (login token shared with /app).
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_DASHBOARD_URL: ${PUBLIC_DASHBOARD_URL:-/app/}
        # Show demo account list on /login when testing. Off by default so a
        # plain bring-up never leaks it; set SHOW_DEMO_LOGINS=true to opt in.
        NEXT_PUBLIC_SHOW_DEMO_LOGINS: ${SHOW_DEMO_LOGINS:-false}
    restart: unless-stopped
    environment:
      # Server-side rendering talks to the API over the compose network.
      API_URL: http://api:8000
    depends_on:
      - api
    # Optional direct access for Next-only work; full staff flow uses gateway.
    ports:
      - "3000:3000"

  # Single local front door: website + staff login + dashboard + API.
  #   http://localhost:8080/          public Sanjay Wood Tech site
  #   http://localhost:8080/login     staff sign-in
  #   http://localhost:8080/app/      staff dashboard
  #   http://localhost:8080/api/…     FastAPI
  gateway:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - website
      - dashboard
      - api

  # Reverse proxy + automatic HTTPS (Phase 10) for remote internet deploys.
  # Opt-in via profile so local `docker compose up` never starts it:
  #   docker compose --profile remote up --build
  # Needs WEBSITE_DOMAIN / DASHBOARD_DOMAIN / API_DOMAIN / CADDY_ACME_EMAIL in .env.
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["remote"]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
      - ./caddy/config:/config
    environment:
      CADDY_ACME_EMAIL: ${CADDY_ACME_EMAIL:-}
      WEBSITE_DOMAIN: ${WEBSITE_DOMAIN:-}
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN:-}
      API_DOMAIN: ${API_DOMAIN:-}
    depends_on:
      - api
      - dashboard
      - website
